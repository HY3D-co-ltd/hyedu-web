name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매일 0시 5분(KST) 다시 빌드한다. 정적 사이트라 날짜로 바뀌는 내용(개인정보 처리방침 시행일,
  # 그에 묶인 GA4 켜짐)은 빌드해야 반영된다. GitHub 예약 실행은 몇십 분 늦을 수 있다.
  schedule:
    - cron: '5 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # /contact 위저드가 접수를 보내는 주소. NEXT_PUBLIC_* 는 빌드 때 브라우저 코드에 박히므로 비밀값이 아니다.
      # 값이 없으면 손님 화면에서 접수가 조용히 안 되므로 빌드를 멈춘다 (위저드 사양 §5.4).
      - name: Check inquiry endpoint
        env:
          NEXT_PUBLIC_INQUIRY_ENDPOINT: ${{ vars.NEXT_PUBLIC_INQUIRY_ENDPOINT }}
        run: |
          if [[ ! "$NEXT_PUBLIC_INQUIRY_ENDPOINT" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::저장소 변수 NEXT_PUBLIC_INQUIRY_ENDPOINT 가 없거나 https 주소가 아닙니다 (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
      # GA4 측정 ID(G-로 시작). 브라우저에 공개되는 값이라 비밀이 아니다.
      # 비어 있으면 GA4 없이 배포하되 경고를 남기고, 형식이 틀리면 수집이 조용히 안 되므로 빌드를 멈춘다.
      # 값이 있어도 시행 중인 처리방침이 이용 분석 쿠키를 안내해야 켜진다(src/components/analytics/GoogleAnalytics.tsx).
      - name: Check GA4 measurement ID
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: |
          if [[ -z "$NEXT_PUBLIC_GA_ID" ]]; then
            echo "::warning::저장소 변수 NEXT_PUBLIC_GA_ID 가 없어 GA4 없이 배포합니다 (Settings → Secrets and variables → Actions → Variables)."
          elif [[ ! "$NEXT_PUBLIC_GA_ID" =~ ^G-[A-Z0-9]+$ ]]; then
            echo "::error::저장소 변수 NEXT_PUBLIC_GA_ID 는 G- 로 시작하는 GA4 측정 ID여야 합니다 (지금 값: $NEXT_PUBLIC_GA_ID)."
            exit 1
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_INQUIRY_ENDPOINT: ${{ vars.NEXT_PUBLIC_INQUIRY_ENDPOINT }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
